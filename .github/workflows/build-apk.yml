
name: Build Vault Protocol APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip VaultProtocolAndroid-Project.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/VaultProtocolAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Protocol-APK
          path: extracted/VaultProtocolAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
